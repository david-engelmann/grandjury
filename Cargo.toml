[package]
name = "grandjury"
version = "0.1.0"
edition = "2021"
description = "Grandjury is a Rust library and command line tool that aggregates recorded answers to a question and prints readings over them."

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "grandjury"
path = "rust/src/main.rs"

[[bin]]
name = "codepoint_scan"
path = "rust/src/bin/codepoint_scan.rs"

# The integration tests live beside the library under rust/tests, so
# each one is named here with its path rather than discovered from a
# root level tests directory.
[[test]]
name = "test_polls"
path = "rust/tests/test_polls.rs"

