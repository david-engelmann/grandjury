[package]
name = "grandjury"
version = "0.1.0"
edition = "2021"

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "grandjury"
path = "rust/src/main.rs"

[[bin]]
name = "codepoint_scan"
path = "rust/src/bin/codepoint_scan.rs"

# The integration tests live beside the library under rust/tests, so
# each one is named here with its path rather than discovered from a
# root level tests directory.
[[test]]
name = "test_polls"
path = "rust/tests/test_polls.rs"

[[test]]
name = "test_cost"
path = "rust/tests/test_cost.rs"

[[test]]
name = "test_seats"
