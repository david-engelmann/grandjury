[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grandjury"
version = "0.1.0"
description = "Ten thousand tiny models polled on any question, stadium vote included"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
grandjury = "grandjury.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
