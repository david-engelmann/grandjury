name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag label for dry-run archive packaging (for example v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: archive (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
            cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
            cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
            cross: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin grandjury
      - name: Smoke check binary (Unix)
        if: runner.os != 'Windows' && !matrix.cross
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/grandjury"
          "$BIN" --help >/dev/null
      - name: Smoke check binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release/grandjury.exe"
          & $bin --help | Out-Null; if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Package archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          STEM="grandjury-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${STEM}"
          cp "target/${{ matrix.target }}/release/grandjury" "dist/${STEM}/grandjury"
          chmod 0755 "dist/${STEM}/grandjury"
          cp README.md LICENSE CHANGELOG.md "dist/${STEM}/"
          tar -C dist -czf "dist/${STEM}.tar.gz" "${STEM}"
          rm -rf "dist/${STEM}"
      - name: Package archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $tag = "${{ inputs.tag }}"
          }
          $stem = "grandjury-$tag-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stem" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/grandjury.exe" "dist/$stem/grandjury.exe"
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$stem/"
          Compress-Archive -Path "dist/$stem" -DestinationPath "dist/$stem.zip" -Force
          Remove-Item -Recurse -Force "dist/$stem"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum grandjury-* > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: "artifacts/grandjury-*"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            artifacts/grandjury-*
            artifacts/SHA256SUMS
