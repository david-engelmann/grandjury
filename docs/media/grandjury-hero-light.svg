<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 511" width="920" height="511" role="img"><title>grandjury - multi-model poll aggregation, jury agreement, and exact cost tallying</title><style>.sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }@keyframes pulseGlow { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }.live-dot { animation: pulseGlow 2.8s ease-in-out infinite; }@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }</style><rect x="1" y="1" width="918" height="509" rx="14" fill="#faf8f4" stroke="#dcd5c7" stroke-width="1.5"/>
        <text x="36" y="44" class="sans" font-size="13" font-weight="700" fill="#575249" letter-spacing="0.8">MULTI-JURY BALLOT AGGREGATION &amp; CONFIDENCE ABSTENTION</text>
        <circle cx="880" cy="39" r="5" fill="#c25e00" class="live-dot"/>
        <text x="866" y="44" text-anchor="end" class="mono" font-size="11" fill="#c25e00">EXACT RATIONAL SHARES</text>

        <rect x="36" y="60" width="510" height="172" rx="8" fill="#ffffff" stroke="#dcd5c7"/>
        <text x="54" y="84" class="sans" font-size="13" font-weight="700" fill="#151411">Question · Should the village library open on Sunday mornings?</text>
        <text x="54" y="112" class="mono" font-size="11.5" fill="#151411">open on Sundays</text>
        <rect x="210" y="100" width="246" height="16" rx="4" fill="#c25e00"/>
        <text x="466" y="113" class="mono" font-size="11.5" font-weight="700" fill="#047857">50 (100.0%)</text>

        <text x="54" y="140" class="mono" font-size="11.5" fill="#575249">stay closed on Sundays</text>
        <rect x="210" y="128" width="246" height="16" rx="4" fill="#f3efe7"/>
        <text x="466" y="141" class="mono" font-size="11.5" fill="#575249">0 (0.0%)</text>

        <line x1="54" y1="160" x2="528" y2="160" stroke="#dcd5c7"/>
        <rect x="54" y="174" width="142" height="42" rx="6" fill="#d1fae5"/>
        <text x="125" y="193" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#047857">50 VALID</text>
        <text x="125" y="208" text-anchor="middle" class="sans" font-size="10.5" fill="#575249">conf &gt;= 0.50</text>

        <rect x="210" y="174" width="156" height="42" rx="6" fill="#fef3c7"/>
        <text x="288" y="193" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#c25e00">50 ABSTAINED</text>
        <text x="288" y="208" text-anchor="middle" class="sans" font-size="10.5" fill="#575249">conf &lt; 0.50 isolated</text>

        <rect x="380" y="174" width="148" height="42" rx="6" fill="#f3efe7"/>
        <text x="454" y="193" text-anchor="middle" class="mono" font-size="12" font-weight="700" fill="#151411">0 SPOILED</text>
        <text x="454" y="208" text-anchor="middle" class="sans" font-size="10.5" fill="#575249">off-ballot guard</text>

        <rect x="564" y="60" width="320" height="172" rx="8" fill="#ffffff" stroke="#dcd5c7"/>
        <text x="582" y="84" class="sans" font-size="13" font-weight="700" fill="#151411">Cross-Wave Census &amp; Live Price Ledger</text>
        <text x="582" y="110" class="mono" font-size="11.5" fill="#151411">64 polls · 567 recorded · 346 valid</text>
        <text x="582" y="132" class="mono" font-size="11.5" fill="#047857">movements · 16 held · 0 moved</text>
        <line x1="582" y1="148" x2="866" y2="148" stroke="#dcd5c7"/>
        <text x="582" y="172" class="mono" font-size="11.5" fill="#c25e00">priced · 50 responses · $0.002600</text>
        <text x="582" y="194" class="mono" font-size="11" fill="#575249">unpriced · jev-1.13.0 (50 responses)</text>
        <text x="582" y="214" class="sans" font-size="11" fill="#575249">22 commands · tally, stadium, agreement, census</text>
        <rect x="36" y="252" width="848" height="231" rx="10" fill="#181613" stroke="#dcd5c7"/><circle cx="56" cy="272" r="5" fill="#ef4444"/><circle cx="72" cy="272" r="5" fill="#f59e0b"/><circle cx="88" cy="272" r="5" fill="#10b981"/><text x="460" y="276" text-anchor="middle" class="mono" font-size="11" fill="#9c9588">grandjury - verified offline examples</text><line x1="36" y1="288" x2="884" y2="288" stroke="#2a2722"/><text x="54" y="310" class="mono" font-size="11.5" fill="#f59e0b">$ grandjury stadium examples/recorded_poll.json</text><text x="54" y="329" class="mono" font-size="11.5" fill="#f2eee6">question, Should the village library open on Sunday mornings?</text><text x="54" y="348" class="mono" font-size="11.5" fill="#f2eee6">responses, 100</text><text x="54" y="367" class="mono" font-size="11.5" fill="#34d399">open on Sundays |########################################| 50, 100.0%</text><text x="54" y="386" class="mono" font-size="11.5" fill="#9c9588">stay closed on Sundays || 0, 0.0%</text><text x="54" y="405" class="mono" font-size="11.5" fill="#f2eee6">  openai-1, openai/gpt-6-luna chose open on Sundays with confidence 0.65</text><text x="54" y="424" class="mono" font-size="11.5" fill="#9c9588">  jev-48, jev-1.13.0 chose open on Sundays with confidence 0.08 and abstained</text><text x="54" y="443" class="mono" font-size="11.5" fill="#f59e0b">$ grandjury cost examples/recorded_poll.json examples/prices.json</text><text x="54" y="462" class="mono" font-size="11.5" fill="#34d399">priced, 50 responses, 0.002600 dollars  |  unpriced model, jev-1.13.0, 50 responses</text></svg>
